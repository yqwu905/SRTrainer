[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "srtrainer"
version = "0.1.0"
description = "Modular PyTorch + Hugging Face Accelerate + Hydra framework for image super-resolution and low-level vision restoration."
requires-python = ">=3.10"
dependencies = [
    "torch==2.9.0",
    "torchvision==0.24.0",
    "accelerate>=1.0.0",
    "hydra-core>=1.3.2",
    "omegaconf>=2.2,<2.4",
    "safetensors>=0.4.3",
    "lpips>=0.1.4",
    "pillow>=10.0.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "pyyaml>=6.0",
    "tensorboard>=2.15.0",
    "huggingface-hub>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6.0",
]
trackers = [
    "wandb",
    "mlflow",
    "swanlab",
]
ocr = [
    "opencv-python-headless>=4.8.0",
    "rapidocr>=3.10.0,<4",
    # ONNX Runtime 1.24 stopped publishing Python 3.10 wheels.
    "onnxruntime>=1.20.0,<1.24; python_version < '3.11'",
    "onnxruntime>=1.20.0; python_version >= '3.11'",
]
npu = [
    "torch-npu==2.9.0; sys_platform == 'linux'",
    "setuptools>=65",
    "decorator", "psutil", "scipy", "attrs"
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["archs*", "data*", "engine*", "losses*", "metrics*", "models*", "utils*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = [
    "requires_textverifier_weights: real TextVerifier Stage-3 asset bundle integration tests",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tools", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]
