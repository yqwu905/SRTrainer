[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "srtrainer"
version = "0.1.0"
description = "Modular PyTorch + Hugging Face Accelerate + Hydra framework for image super-resolution and low-level vision restoration."
requires-python = "==3.10.*"
dependencies = [
    "torch==2.9.0",
    "torchvision==0.24.0",
    "accelerate>=1.0.0",
    "hydra-core>=1.3.2",
    "omegaconf>=2.2,<2.4",
    "safetensors>=0.4.3",
    "lpips>=0.1.4",
    "pillow>=10.0.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "pyyaml>=6.0",
    "tensorboard>=2.15.0",
    "huggingface-hub>=0.25.0",
    "timm>=1.0.31",
    "diffusers>=0.41.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6.0",
]
trackers = [
    "wandb",
    "mlflow",
    "swanlab",
]
ocr = [
    "opencv-python-headless>=4.8.0",
    "rapidocr>=3.10.0,<4",
]
npu = [
    "torch-npu==2.9.0; sys_platform == 'linux'",
    "setuptools>=65",
    "decorator", "psutil", "scipy", "attrs"
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["archs*", "config*", "data*", "engine*", "hydra_plugins*", "losses*", "metrics*", "models*", "utils*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
markers = [
    "requires_textverifier_weights: real TextVerifier Stage-3 asset bundle integration tests",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tools", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

# VOSR-PB: rdp_vae_nch/ 是从上游 NCH_AIGC_Model 原样搬运的 vendored 代码
# （rdp_vae_ch64_16x.py + NAFNet-RDP 的 cpython_310 编译后端），不参与本仓库风格检查。
[tool.ruff.lint.per-file-ignores]
"src/archs/vosr2_PB/rdp_vae_nch/**" = [
    "B006", "B007", "E701", "E722", "F401", "F821", "F841",
    "I001", "UP008", "UP009", "UP031",
]

[tool.uv]
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'aarch64'"
]
