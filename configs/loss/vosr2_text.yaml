l1:
  weight: 1.0
  criterion:
    _target_: losses.L1Loss
    reduction: mean
lpips:
  weight: 0.02
  criterion:
    _target_: losses.LPIPSLoss
    net: vgg
ocr_kl:
  weight: 0.0005
  criterion:
    _target_: losses.OCRKLLoss
    checkpoint: PaddlePaddle/PP-OCRv5_server_rec_safetensors
    temperature: 1.0
    input_range: "0_1"
    strip_batch_size: 4
    max_lines_per_image: 8
    max_strip_width: 512
    width_bucket_step: 32
    amp_dtype: bf16
    use_checkpoint: true
    sync_ddp_counts: true
glyph:
  weight: 1.0
  criterion:
    _target_: losses.GlyphLoss
    model_dir: null
    repo_id: ATH-MaaS/TextVerifier-CJK-CLIP
    batch_size: 8
    input_range: "0_1"
    sync_ddp_counts: true
    cache_dir: null
    local_files_only: false
