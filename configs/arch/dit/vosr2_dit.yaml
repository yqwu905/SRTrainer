_target_: archs.VOSR2DiT

# VOSR2 1.4B single-step LightningDiT configuration (VOSR2/args.json exact parity)
input_size: 64                  # Reference latent grid (512 / 8) matching official VOSR2 checkpoint
patch_size: 2
in_channels: 32                 # 16 (LQ latent) + 16 (noise)
out_channels: 16
hidden_size: 1536
depth: 36
num_heads: 24
mlp_ratio: 4.0
z_dims: 1024
encdim_ratio: 3
use_qknorm: true
use_swiglu: true
use_rope: true
use_rmsnorm: true
wo_shift: false
use_checkpoint: true            # Recommended activation checkpointing for 1.4B DiT training
rope_mode: interpolate          # interpolate | extrapolate

# Optional direct DiT checkpoint (local .safetensors/dir or HuggingFace repo + filename)
pretrained_path: null
pretrained_filename: VOSR2/checkpoints/ema_model.safetensors
pretrained_strict: true
pretrained_key: null
