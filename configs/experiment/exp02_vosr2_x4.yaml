# @package _global_
defaults:
  - /experiment/base_sr_x4
  - override /arch: vosr2_x4
  - override /loss: vosr2_text
  - override /optim: adamw_cosine
  - _self_

exp_name: exp02_vosr2_onestep_text_x4
scale: 4

data:
  gt_size: 512
  batch_size_per_gpu: 1
  text_crop_prob: 0.7
  augment:
    hflip: false
    vflip: false
    rot90: false

optim:
  optimizer:
    lr: 5.0e-6
    betas: [0.9, 0.95]
    weight_decay: 0.01
  scheduler:
    eta_min: 1.0e-7

trainer:
  total_iters: 10000
  val_interval: 1000
  save_interval: 1000
  mixed_precision: bf16
  gradient_accumulation_steps: 1
  grad_clip_norm: 1.0
  val_tile:
    enabled: true
    size: auto
    overlap: 16
    batch_size: 1
    blend_mode: cosine
    pad_multiple: 4
