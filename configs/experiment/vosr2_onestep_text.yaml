# @package _global_
defaults:
  - override /model: vosr
  - override /arch/vae: qwen_vae2d
  - override /arch/dit: vosr2_dit
  - override /arch/dino: dinov2_vitl14
  - override /data: mixed_sr
  - override /loss: vosr2_text
  - override /optim: adamw_cosine
  - _self_

exp_name: vosr2_onestep_text
scale: 1

data:
  gt_size: 512
  batch_size_per_gpu: 1
  text_crop_prob: 0.7
  augment:
    hflip: false
    vflip: false
    rot90: false

optim:
  optimizer:
    lr: 5.0e-6
    betas: [0.9, 0.95]
    weight_decay: 0.01
  scheduler:
    eta_min: 1.0e-7

trainer:
  total_iters: 10000
  val_interval: 1000
  save_interval: 1000
  val_tile:
    overlap: 64
    pad_multiple: 16
