defaults:
  - _self_
  - arch: null
  - infer: default
  - override hydra/job_logging: disabled

# Standalone mode example: arch=toy_x4 scale=4 infer.weights_path=/path/to/weights.safetensors
arch: null
scale: 4

hydra:
  job:
    chdir: false
  run:
    dir: ${infer.output_dir}
  output_subdir: null
