defaults:
  - base_infer
  - _self_
  - model: null
  - arch/vae: null
  - arch/dit: null
  - arch/dino: null
  - infer: default
  - override hydra/job_logging: disabled

# Select a model and its architectures, then point infer.input to an image directory.
# Example: model=vosr arch/vae=qwen_vae2d arch/dit=vosr2_dit arch/dino=dinov2_vitl14
# Component checkpoints can be supplied via model.pretrain.<component>.path.
hydra:
  job:
    chdir: false
  run:
    dir: ${infer.output_dir}
  output_subdir: null
