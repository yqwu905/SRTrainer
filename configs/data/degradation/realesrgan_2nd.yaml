_target_: srtrainer.data.degradation.RealESRGANDegrader
scale: ${scale}
use_usm: false                 # Optional GT USM sharpening (applied to gt_only subset)
queue_size: 0                  # Optional post-degradation TrainingPool (0 = off; >0 must be multiple of batch_size)

# CPU blur & sinc kernel generation parameters (also read by MixedSRDataset)
kernel_cfg:
  kernel_size: 21
  kernel_range: [7, 9, 11, 13, 15, 17, 19, 21]
  kernel_list: [iso, aniso, generalized_iso, generalized_aniso, plateau_iso, plateau_aniso]
  kernel_prob: [0.45, 0.25, 0.12, 0.03, 0.12, 0.03]
  blur_sigma: [0.2, 3.0]
  betag_range: [0.5, 4.0]
  betap_range: [1.0, 2.0]
  sinc_prob: 0.1
  kernel_list2: [iso, aniso, generalized_iso, generalized_aniso, plateau_iso, plateau_aniso]
  kernel_prob2: [0.45, 0.25, 0.12, 0.03, 0.12, 0.03]
  blur_sigma2: [0.2, 1.5]
  betag_range2: [0.5, 4.0]
  betap_range2: [1.0, 2.0]
  sinc_prob2: 0.1
  final_sinc_prob: 0.8

# 1st-order GPU degradation parameters (Real-ESRGAN defaults)
resize_prob: [0.2, 0.7, 0.1]       # [up, down, keep]
resize_range: [0.15, 1.5]
gaussian_noise_prob: 0.5
noise_range: [1.0, 30.0]
poisson_scale_range: [0.05, 3.0]
gray_noise_prob: 0.4
jpeg_range: [30.0, 95.0]

# 2nd-order GPU degradation parameters
second_blur_prob: 0.8
resize_prob2: [0.3, 0.4, 0.3]      # [up, down, keep]
resize_range2: [0.3, 1.2]
gaussian_noise_prob2: 0.5
noise_range2: [1.0, 25.0]
poisson_scale_range2: [0.05, 2.5]
gray_noise_prob2: 0.4
jpeg_range2: [30.0, 95.0]
