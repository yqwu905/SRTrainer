defaults:
  - degradation: realesrgan_2nd
  - _self_

gt_size: 256                   # Training GT crop size; LQ input size is gt_size // scale
scale: ${scale}
batch_size_per_gpu: 8
num_workers: 8
pin_memory: true
persistent_workers: true

# Training sources ONLY (validation datasets belong exclusively in configs/metric/).
# Do NOT specify `mode` — gt_only vs paired is auto-detected per sample from JSON.
sources:
  - name: df2k_gt
    root_dir: /data/DF2K
    json_path: /data/manifests/df2k_gt.json
    ratio: 0.7
  - name: biz_real_paired
    root_dir: /data/BizReal
    json_path: /data/manifests/biz_real_paired.json
    ratio: 0.3

augment:
  hflip: true
  vflip: true
  rot90: true
