defaults:
  - base_data
  - degradation: realesrgan_2nd
  - _self_

# All data defaults live in DataConfig / AugmentConfig (src/config/schema.py).
scale: ${scale}

# Training sources ONLY (validation datasets belong exclusively in configs/metric/).
# Do NOT specify `mode` — gt_only vs paired is auto-detected per sample from JSON.
sources:
  - name: magazine_small_text
    root_dir: /home/dataset/train/magazine_small_text
    json_path: /home/dataset/train/magazine_small_text/magazine_small_text_filter.json
    ratio: 1.0
